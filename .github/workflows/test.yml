name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0'

      - name: Build plugin
        run: dotnet build MatchZy.csproj -c Release

      - name: Run unit tests
        run: dotnet test tests/MatchZy.Tests -c Release
